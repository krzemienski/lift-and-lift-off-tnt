<!DOCTYPE html>
<html>
<head>
    <title>Simple HLS Test</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { margin: 0; background: #0A2340; color: white; font-family: sans-serif; }
        #video { width: 100%; height: 60vh; object-fit: cover; background: #000; }
        #status { padding: 20px; }
        .success { color: #4ade80; }
        .error { color: #f87171; }
    </style>
</head>
<body>
    <video id="video" controls autoplay muted></video>
    <div id="status">Initializing...</div>
    <script>
        const video = document.getElementById('video');
        const status = document.getElementById('status');
        
        function updateStatus(msg, isError = false) {
            status.innerHTML = msg;
            status.className = isError ? 'error' : 'success';
        }
        
        if (Hls.isSupported()) {
            const hls = new Hls({
                debug: false,
                enableWorker: true,
                lowLatencyMode: true,
                maxBufferLength: 10
            });
            
            hls.loadSource('/videos/hls/desktop-simple.m3u8');
            hls.attachMedia(video);
            
            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                updateStatus('✓ Manifest loaded, attempting playback...');
                video.play().then(() => {
                    updateStatus('✓ VIDEO IS PLAYING SUCCESSFULLY!');
                }).catch(err => {
                    updateStatus('⚠ Video loaded but autoplay blocked (click play button): ' + err.message);
                });
            });
            
            hls.on(Hls.Events.ERROR, (event, data) => {
                updateStatus('✗ HLS Error: ' + data.type + ' - ' + data.details, true);
                console.error('HLS Error:', data);
            });
            
            video.addEventListener('playing', () => {
                updateStatus('✓ VIDEO IS PLAYING! Current time: ' + video.currentTime.toFixed(2) + 's');
            });
            
            video.addEventListener('timeupdate', () => {
                if (video.currentTime > 0) {
                    status.innerHTML = '✓ Playing: ' + video.currentTime.toFixed(2) + 's / ' + video.duration.toFixed(2) + 's';
                }
            });
        } else {
            updateStatus('HLS.js not supported in this browser', true);
        }
    </script>
</body>
</html>
