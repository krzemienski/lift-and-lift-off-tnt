<!DOCTYPE html>
<html>
<head>
    <title>HLS Video Test</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body style="background: #0A2340; padding: 20px;">
    <h1 style="color: #F7C948;">HLS Video Test</h1>
    
    <div style="display: flex; gap: 20px;">
        <div>
            <h2 style="color: white;">Desktop Video</h2>
            <video id="desktop-video" controls style="width: 400px; height: 300px;"></video>
            <p id="desktop-status" style="color: white;">Loading...</p>
        </div>
        
        <div>
            <h2 style="color: white;">Mobile Video</h2>
            <video id="mobile-video" controls style="width: 300px; height: 400px;"></video>
            <p id="mobile-status" style="color: white;">Loading...</p>
        </div>
    </div>

    <script>
        function testVideo(videoId, statusId, playlistUrl) {
            const video = document.getElementById(videoId);
            const status = document.getElementById(statusId);
            
            if (Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(playlistUrl);
                hls.attachMedia(video);
                
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    status.textContent = '✅ Manifest loaded successfully!';
                    status.style.color = '#4ade80';
                });
                
                hls.on(Hls.Events.ERROR, function(event, data) {
                    if (data.fatal) {
                        status.textContent = `❌ Fatal error: ${data.type} - ${data.details}`;
                        status.style.color = '#ef4444';
                    } else {
                        status.textContent = `⚠️ Error: ${data.type} - ${data.details}`;
                        status.style.color = '#fbbf24';
                    }
                });
                
                hls.on(Hls.Events.FRAG_LOADED, function(event, data) {
                    status.textContent = `✅ Playing! Loaded segment ${data.frag.sn}`;
                    status.style.color = '#4ade80';
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = playlistUrl;
                video.addEventListener('loadedmetadata', function() {
                    status.textContent = '✅ Native HLS loaded!';
                    status.style.color = '#4ade80';
                });
                video.addEventListener('error', function(e) {
                    status.textContent = `❌ Native HLS error: ${e.message}`;
                    status.style.color = '#ef4444';
                });
            }
        }
        
        // Test both videos
        testVideo('desktop-video', 'desktop-status', '/videos/hls/desktop_master.m3u8');
        testVideo('mobile-video', 'mobile-status', '/videos/hls/mobile_master.m3u8');
        
        // Also test direct segment access
        fetch('/videos/hls/desktop/video1/segment000.m4s')
            .then(r => console.log('Desktop segment test:', r.status === 200 ? '✅ Success' : '❌ Failed'))
            .catch(e => console.error('Desktop segment test failed:', e));
            
        fetch('/videos/hls/mobile/video1/segment000.m4s')
            .then(r => console.log('Mobile segment test:', r.status === 200 ? '✅ Success' : '❌ Failed'))
            .catch(e => console.error('Mobile segment test failed:', e));
    </script>
</body>
</html>
